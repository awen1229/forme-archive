<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>GOOD THINGS, / THE INDEX V2 Visual Review</title>
<style>
:root{font-family:"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC",sans-serif;color:#2a322b;background:#ebeee9}
*{box-sizing:border-box}body,html{margin:0;height:100%;overflow:hidden}
button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #315f40;outline-offset:3px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#f6f8f4;border-bottom:1px solid #d5ddd3;padding:11px clamp(14px,2.8vw,35px)}
.id{display:grid;gap:3px}.id strong{font:600 12px/1.3 Arial,sans-serif;color:#315f40;letter-spacing:.07em}.id small{font-size:11px;line-height:1.5;color:#687568}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button,.actions a{border:1px solid #cdd6ca;border-radius:3px;background:#fff;color:#4e5b51;padding:10px 13px;text-decoration:none;font-size:11px}
.actions button[aria-pressed=true]{background:#315f40;border-color:#315f40;color:#fff}
.actions span{font:500 10px/1.4 Arial,sans-serif;color:#6a796d;margin-right:8px}
.canvas{height:calc(100dvh - var(--bar,70px));display:flex;justify-content:center;align-items:stretch;background:white}
.canvas.phone{padding:10px;background:#ebeee9}
iframe{height:100%;border:0;display:block;width:100%;background:white}
.canvas.phone iframe{width:min(390px,100%);border:1px solid #d0d8ce;box-shadow:0 10px 30px #17251b18}
@media(max-width:680px){.toolbar{padding:10px 11px;gap:7px}.id{width:100%}.id small{font-size:10px}.actions{width:100%}.actions span{display:none}.actions button,.actions a{padding:9px 12px;font-size:10px}}
</style>
</head>
<body>
<div class="toolbar" id="toolbar" role="region" aria-label="GOOD THINGS 品牌頁設計比較">
 <div class="id"><strong>GOOD THINGS, / THE INDEX PROFILE 02</strong><small>BLACK FRAME 選定版 · 實際品牌頁的版型與視覺比例示意，資料不會發布</small></div>
 <div class="actions"><span>EDITOR'S NOTE / A SELECTED</span><button type="button" data-size="desktop" aria-pressed="true">桌面版</button><button type="button" data-size="phone" aria-pressed="false">手機版</button><a href="./?intro=off#/brands" target="_blank" rel="noopener noreferrer">開啟實際品牌目錄 ↗</a></div>
</div>
<div class="canvas" id="canvas"><iframe id="view" src="./index-profile-v2-demo.html" title="GOOD THINGS THE INDEX 品牌內頁新版示意"></iframe></div>
<script>
(function(){
 const bar=document.getElementById('toolbar'),canvas=document.getElementById('canvas');
 const update=()=>document.documentElement.style.setProperty('--bar',Math.ceil(bar.getBoundingClientRect().height)+'px');
 new ResizeObserver(update).observe(bar);update();
 document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{
  const mobile=b.dataset.size==='phone';
  canvas.classList.toggle('phone',mobile);
  document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
 }));
})();
</script>
</body>
</html>
