function updatePreview(){if(!document.getElementById('editor-form'))return;const title=fval(editorKind==='brand'?'name':'title')||'文章標題';document.getElementById('p-title').textContent=title;document.getElementById('p-excerpt').textContent=fval(editorKind==='brand'?'desc':'excerpt')||'摘要與介紹將顯示在此。';const body=document.getElementById('p-body');if(body)body.textContent=fval('body');const image=document.getElementById('p-cover');if(image){image.hidden=!editorCover;if(editorCover)image.src=editorCover}}
function resetEditor(){editingId='';editorCover='';render()}
function fillEditor(x){const map=editorKind==='brand'?{name:x.name,founder:x.founder,founded:x.founded,desc:x.desc,tags:(x.tags||[]).join(', '),url:x.url}:editorKind==='article'?{title:x.title,brand:x.brand,category:x.category,excerpt:x.excerpt,body:(x.body||[]).join('\n\n'),source:x.source}:{title:x.title,brand:x.brand,category:x.type,excerpt:x.summary,season:x.season,publisher:x.publisher,date:x.date,source:x.url};for(const [k,v] of Object.entries(map)){const el=document.getElementById('f-'+k);if(el)el.value=v||''}editorCover=x.cover||'';updatePreview()}
function saveEditor(){const arr=editorKind==='article'?localArticles:editorKind==='brand'?localBrands:localReferenceEntries;let x;if(editorKind==='brand'){if(!fval('name'))return alert('請輸入品牌名稱');x={slug:editingId||basicSlug(),name:fval('name'),founder:fval('founder'),founded:fval('founded'),desc:fval('desc'),tags:fval('tags').split(',').map(s=>s.trim()).filter(Boolean),url:fval('url')||null}}else if(editorKind==='article'){if(!fval('title')||!fval('excerpt')||!fval('body'))return alert('請填寫標題、摘要與正文');x={slug:editingId||basicSlug(),title:fval('title'),brand:fval('brand'),category:fval('category'),excerpt:fval('excerpt'),body:fval('body').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean),source:fval('source')||null,cover:editorCover}}else{if(!fval('title'))return alert('請填寫資料標題');x={id:editingId||basicSlug(),title:fval('title'),brand:fval('brand'),type:fval('category'),season:fval('season')||'常設',summary:fval('excerpt'),publisher:fval('publisher'),date:fval('date'),url:fval('source')}}
const index=arr.findIndex(v=>(v.slug||v.id)===editingId);if(index>=0){const prev=arr[index];arr[index]=x;const live=editorKind==='brand'?brands:editorKind==='article'?articles:library;const j=live.findIndex(v=>(v.slug||v.id)===editingId);if(j>=0)live[j]=x}else{arr.push(x);(editorKind==='brand'?brands:editorKind==='article'?articles:library).push(x)}if(persistCms()){const kindSaved=editorKind;const savedSlug=x.slug;editingId='';editorCover='';const target=kindSaved==='article'?'#/article/'+savedSlug:kindSaved==='brand'?'#/brand/'+savedSlug:'#/archive';try{sessionStorage.setItem('forme_v12_save_notice','已儲存成功！這是目前電腦的本機資料。請回 EDITOR 匯出 JSON 備份。')}catch(e){alert('已儲存。可回 EDITOR 匯出 JSON 備份。')};if(location.hash===target)render();else location.hash=target;}else{alert('目前只保留在此頁的暫存狀態，尚未成功寫入瀏覽器。請匯出 JSON 備份。')}}
function downloadCms(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),articles:localArticles,brands:localBrands,references:localReferenceEntries},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='FORME-ARCHIVE-內容備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importCms(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.version!==1||!Array.isArray(d.articles)||!Array.isArray(d.brands)||!Array.isArray(d.references))throw Error('格式不正確');if(!confirm('匯入將以備份資料取代目前自行新增的內容，確定嗎？'))return;const oldArticles=localArticles.map(x=>x.slug),oldBrands=localBrands.map(x=>x.slug);for(let i=articles.length-1;i>=0;i--)if(oldArticles.includes(articles[i].slug))articles.splice(i,1);for(let i=brands.length-1;i>=0;i--)if(oldBrands.includes(brands[i].slug))brands.splice(i,1);for(let i=library.length-1;i>=0;i--)if(localReferenceEntries.includes(library[i]))library.splice(i,1);localArticles.splice(0,localArticles.length,...d.articles);localBrands.splice(0,localBrands.length,...d.brands);localReferenceEntries.splice(0,localReferenceEntries.length,...d.references);articles.push(...localArticles);brands.push(...localBrands);library.push(...localReferenceEntries);persistCms();resetEditor();alert('匯入成功')}catch(e){alert('匯入失敗：請確認這是 FORME ARCHIVE 匯出的 JSON 檔案')}};r.readAsText(file)}
document.addEventListener('click',e=>{const kind=e.target.closest('[data-kind]');if(kind){editorKind=kind.dataset.kind;resetEditor();return}if(e.target.closest('#editor-reset')){resetEditor();return}if(e.target.closest('#export-cms')){downloadCms();return}if(e.target.closest('#import-cms')){document.getElementById('import-cms-file').click();return}const edit=e.target.closest('[data-edit]');if(edit){const a=editorKind==='article'?localArticles:editorKind==='brand'?localBrands:localReferenceEntries;const x=a[+edit.dataset.edit];if(x){editingId=x.slug||x.id;fillEditor(x);window.scrollTo({top:0,behavior:'smooth'})}return}const del=e.target.closest('[data-delete]');if(del){if(!confirm('確定刪除這筆自行新增的資料？'))return;const a=editorKind==='article'?localArticles:editorKind==='brand'?localBrands:localReferenceEntries;const x=a[+del.dataset.delete];const live=editorKind==='article'?articles:editorKind==='brand'?brands:library;const i=live.indexOf(x);if(i>=0)live.splice(i,1);a.splice(+del.dataset.delete,1);persistCms();resetEditor()}});
document.addEventListener('submit',e=>{if(e.target.id==='editor-form'){e.preventDefault();saveEditor()}});
document.addEventListener('input',e=>{if(e.target.closest('#editor-form'))updatePreview()});
document.addEventListener('change',e=>{if(e.target.id==='f-cover'){const file=e.target.files[0];if(!file)return;if(file.size>550000){alert('圖片過大，請選擇 500KB 左右的壓縮圖片。');e.target.value='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('只接受 JPG、PNG、WebP 圖片');return}const reader=new FileReader();reader.onload=()=>{editorCover=reader.result;updatePreview()};reader.readAsDataURL(file)}if(e.target.id==='import-cms-file')importCms(e.target.files[0])});

function render(){const path=location.hash.slice(1)||'/';const [pathName,paramString]=path.split('?');const segments=pathName.split('/').filter(Boolean);let page=segments[0]||'home';if(page==='stock'&&paramString){let params=new URLSearchParams(paramString);filters.brand=params.get('brand')||filters.brand}let html=page==='home'?viewHome():page==='brands'?viewBrands():page==='brand'?viewBrand(segments[1]):page==='journal'?viewJournal():page==='archive'?viewArchive():page==='article'?viewArticle(segments[1]):page==='stock'?viewStock():page==='piece'?viewPiece(segments[1]):page==='saved'?viewSaved():page==='about'?viewAbout():page==='admin'?viewAdmin():notFound();$('#app').innerHTML=html;try{const notice=sessionStorage.getItem('forme_v12_save_notice');if(notice){const banner=document.createElement('div');banner.setAttribute('role','status');banner.style.cssText='padding:14px 20px;background:#e4eadf;color:#274b2c;border-bottom:1px solid #b9ceb1;font-size:14px;line-height:1.6';banner.textContent=notice;document.getElementById('app').prepend(banner);sessionStorage.removeItem('forme_v12_save_notice')}}catch(e){}document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===page));updateSaveCount();renderArchiveResults();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-save]');if(btn){const id=btn.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.setItem('forme_saved',JSON.stringify(saved));updateSaveCount();if(location.hash.startsWith('#/saved'))render();else{document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{b.classList.toggle('saved',saved.includes(id));b.textContent=saved.includes(id)?'♥ 已收藏':'♡ 收藏'})}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.q=e.target.value;renderResults()}});
document.addEventListener('change',e=>{if(e.target.id==='brand-filter'){filters.brand=e.target.value;renderResults()}if(e.target.id==='size-filter'){filters.size=e.target.value;renderResults()}if(e.target.id==='available-filter'){filters.available=e.target.checked;renderResults()}if(e.target.id.startsWith('archive-')&&e.target.id!=='archive-results'){archiveFilters[e.target.id.replace('archive-','')]=e.target.value;renderArchiveResults()}});
$('#menu-toggle').addEventListener('click',()=>{const n=$('#mobile-nav');n.hidden=!n.hidden;$('#menu-toggle').setAttribute('aria-expanded',String(!n.hidden))});
$('#mobile-nav').addEventListener('click',e=>{if(e.target.closest('a')){$('#mobile-nav').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false')}});
window.addEventListener('hashchange',render);render();

</script>
</body>
</html>
