name: MARKET RADAR data sync
on:
  workflow_dispatch:
  schedule:
    # 19:35 Taiwan time; schedule may be delayed by GitHub
    - cron: '35 11 * * 1-5'
    # Retry at 21:05 Taiwan time for delayed official feeds
    - cron: '5 13 * * 1-5'
  push:
    paths:
      - '.github/workflows/market-radar-sync.yml'
      - 'market-radar/scripts/sync.mjs'
      - 'market-radar/scripts/sync-earnings.mjs'
      - 'market-radar/scripts/build-picks.mjs'
permissions:
  contents: write
concurrency:
  group: market-radar-data-sync
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect verified TWSE and TPEx close data
        run: node market-radar/scripts/sync.mjs
      - name: Collect published EPS financial statements and model scenarios
        run: node market-radar/scripts/sync-earnings.mjs
        continue-on-error: true
      - name: Build daily research candidates, event notes and macro risk overlay
        run: node market-radar/scripts/build-picks.mjs
      - name: Commit refreshed public snapshots
        run: |
          git config user.name "market-radar-bot"
          git config user.email "market-radar-bot@users.noreply.github.com"
          git add market-radar/data/latest.json market-radar/data/series.json market-radar/data/news.json
          if [ -f market-radar/data/earnings.json ]; then git add market-radar/data/earnings.json; fi
          git add market-radar/data/picks.json market-radar/data/macro.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh MARKET RADAR official EOD snapshot"
            # Another site update can land during collection. Rebase before publish.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published refreshed snapshots"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish after three retries"
                exit 1
              fi
              sleep "$attempt"
            done
          else
            echo "No changes to the public snapshots"
          fi
