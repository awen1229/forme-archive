name: MARKET RADAR daily research watchlist
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-radar-research.yml'
      - 'market-radar/scripts/build-picks.mjs'
permissions:
  contents: write
concurrency:
  group: market-radar-data-sync
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile research watchlist from last verified snapshots
        run: node market-radar/scripts/build-picks.mjs
      - name: Publish watchlist JSON
        run: |
          git config user.name "market-radar-bot"
          git config user.email "market-radar-bot@users.noreply.github.com"
          git add market-radar/data/picks.json market-radar/data/macro.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish daily research watchlist"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$attempt"
            done
          else
            echo "Research watchlist unchanged"
          fi
