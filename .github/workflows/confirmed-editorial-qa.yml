name: Confirmed GOOD THINGS editorial release QA
on:
  push:
    branches:
      - release/confirmed-editorial-v30-20261028
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  confirmed-editorial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check index design script syntax
        run: node --check gt-index-profile-v2.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start site in isolated local environment
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/editorial-site.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/editorial-site.log
          exit 1
      - name: Verify actual editorial layout and published INDEX in Chromium
        run: node .github/scripts/confirmed-editorial-browser-qa.mjs
