function catSector(){const rows=rowMap();return Object.entries(SECTOR_POOL).concat(state.custom.length?[["自訂觀察",state.custom.map(s=>[s.code,s.name])]]:[]).map(([sector,pairs])=>{
  const available=pairs.map(([code])=>rows.get(code)).filter(r=>r?.pct!=null);
  const avg=available.length?available.reduce((s,r)=>s+r.pct,0)/available.length:null;
  const validI=available.filter(r=>r.foreign!=null&&r.trust!=null);
  const foreign=validI.length?validI.reduce((s,r)=>s+r.foreign,0):null;
  const trust=validI.length?validI.reduce((s,r)=>s+r.trust,0):null;
  return {sector,count:pairs.length,valid:available.length,avg,foreign,trust,up:available.filter(r=>r.pct>0).length};
 }).sort((a,b)=> (b.avg??-1e6)-(a.avg??-1e6));}

function historyFlow(code,n,who){
  const candidates=state.history.filter(h=>h?.date&&h.rows?.[code]&&typeof h.rows[code][who]==='number').sort((a,b)=>b.date.localeCompare(a.date));

  const recent=candidates.slice(0,n);
  return recent.reduce((sum,r)=>sum+r.rows[code][who],0);
}

function registerSnapshot(data){
 const date=data.asOf; if(!date || !Array.isArray(data.rows) || !data.rows.length) throw new Error('缺少日期或有效行情。');
 const snap={date,rows:Object.fromEntries(data.rows.filter(x=>x.code&&x.close!=null).map(r=>[r.code,{foreign:typeof r.foreign==='number'?r.foreign:null,trust:typeof r.trust==='number'?r.trust:null,close:r.close,pct:r.pct}]))};
 const ix=state.history.findIndex(s=>s.date===date);if(ix>=0)state.history[ix]=snap;else state.history.push(snap);
 state.history.sort((a,b)=>b.date.localeCompare(a.date));state.history=state.history.slice(0,80);
 state.data=data;persist();render();
}
async function refresh(options={}){
 if(state.refreshing)return;
 const quiet=options&&options.quiet===true;
 state.refreshing=true;
 $('refreshBtn').disabled=true;
 $('refreshBtn').innerHTML='⌛ 讀取中';
 if(!quiet)setNotice('正在讀取 GitHub Pages 已同步的交易所官方盤後快照。');
 try{
  if(location.protocol==='file:'||location.protocol==='about:')throw new Error('離線 HTML 無法自動連線，請使用線上網址');
  const response=await fetch('./data/latest.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('自動同步快照尚未產生，HTTP '+response.status);
  const data=await response.json();
  if(!data.asOf||!Array.isArray(data.rows)||data.rows.length<300)throw new Error('行情快照日期或內容不完整');
  if(state.data?.asOf&&state.data.asOf>data.asOf&&state.data.origin!=='import')throw new Error('線上資料比本機快照更舊，已保留本機');
  data.origin='official';
  try{
    const hr=await fetch('./data/series.json?v='+Date.now(),{cache:'no-store'});
    if(hr.ok){
      const history=await hr.json();
      if(Array.isArray(history.days)){
        for(const item of history.days){
          if(!item.date||!item.rows||typeof item.rows!=='object')continue;
          const i=state.history.findIndex(x=>x.date===item.date);
          if(i<0)state.history.push(item);
          else if(Object.keys(item.rows).length>Object.keys(state.history[i].rows||{}).length)state.history[i]=item;
        }
        state.history.sort((a,b)=>b.date.localeCompare(a.date));
        state.history=state.history.slice(0,80);
      }
    }
  }catch(e){console.warn('籌碼歷史暫時無法載入',e);}
  try{
    const nr=await fetch('./data/news.json?v='+Date.now(),{cache:'no-store'});
    if(nr.ok){const n=await nr.json();if(Array.isArray(n.items)){state.feed=n.items;state.feedUpdatedAt=n.generatedAt||null;state.feedSources=n.sourceStatus||{};}}
  }catch(e){console.warn('官方消息摘要未能同步',e);}
  registerSnapshot(data);
  window.marketRadarLastSyncCheck=Date.now();
  setNotice('<strong>官方盤後資料已同步。</strong> 交易日 '+esc(data.asOf)+'，股票 '+fmt(data.rows.length,0)+' 檔，法人資料覆蓋 '+fmt(data.summary?.withInst,0)+' 檔。網站上傳時間：'+esc((data.generatedAt||'').replace('T',' ').slice(0,16))+' UTC。非盤中即時報價；若資料來源異常，請查看「資料管理」。','success');
 }catch(e){
  setNotice('<strong>自動同步暫不可用：</strong>'+esc(e.message)+'。已保留原快照與研究紀錄；可查看資料管理頁的來源狀態。','error');
 }finally{
  state.refreshing=false;
  $('refreshBtn').disabled=false;
  $('refreshBtn').innerHTML='↻ <span>更新資料</span>';
 }
}

function parseCSV(text){const lines=[];let cells=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(ch===','&&!quote){cells.push(cell);cell='';}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;cells.push(cell);if(cells.some(x=>x.trim()))lines.push(cells);cells=[];cell='';}else cell+=ch;}cells.push(cell);if(cells.some(x=>x.trim()))lines.push(cells);const headers=(lines.shift()||[]).map(h=>h.trim().replace(/^\uFEFF/,''));return lines.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));}

 if(!rows.length)throw new Error('找不到可辨識的股票資料：至少需要 code、close、date 欄位');
 const dates=[...new Set(rows.map(r=>r.date))];if(dates.length!==1||!/^\d{4}-\d{2}-\d{2}$/.test(dates[0]))throw new Error('一次僅支援一個交易日，date 須為 YYYY-MM-DD');
 registerSnapshot({asOf:dates[0],origin:'import',generatedAt:new Date().toISOString(),rows,indices:[],summary:{total:rows.length,up:rows.filter(r=>r.pct>0).length,down:rows.filter(r=>r.pct<0).length,withInst:rows.filter(r=>r.foreign!=null&&r.trust!=null).length},sourceStatus:{}});
 setNotice(`<strong>CSV 匯入成功。</strong> 共 ${rows.length} 檔，交易日 ${dates[0]}。匯入欄位由使用者提供，並非 App 已核實的官方行情。`,'success');
}
function importJSON(text){const data=JSON.parse(text);if(data.format!=='market-radar-v1'||!data.payload)throw new Error('不是 MARKET RADAR 格式的備份檔');const p=data.payload;
 Object.assign(state,{data:p.data||null,history:Array.isArray(p.history)?p.history:[],watch:Array.isArray(p.watch)?p.watch:baseWatch,eps:p.eps||{},news:Array.isArray(p.news)?p.news:[],journal:Array.isArray(p.journal)?p.journal:[],custom:Array.isArray(p.custom)?p.custom:[]});persist();render();setNotice('<strong>備份已還原。</strong> 請核對快照日期與來源。','success');}
function pickFile(onText){const input=document.createElement('input');input.type='file';input.accept='.csv,.json,text/csv,application/json';input.style.display='none';input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{onText(await file.text());}catch(e){alert('匯入失敗：'+e.message);}input.remove();});document.body.appendChild(input);input.click();}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-tab]');if(nav){state.tab=nav.dataset.tab;render();window.scrollTo(0,0);return;}
 const el=e.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action,code=el.dataset.code;
 if(action==='refresh')refresh();else if(action==='watch') {watchToggle(code);if($('dialog').open)closeModal();}else if(action==='watchOnly'){state.watchOnly=!state.watchOnly;render();}
 else if(action==='stock')showStock(code);else if(action==='close')closeModal();else if(action==='goValuation'){state.activeStock=code;state.tab='valuation';closeModal();render();}
 else if(action==='editEps')editEps();else if(action==='addNote')noteForm();else if(action==='addNews')newsForm();
 else if(action==='export')exportState();else if(action==='importCsv')pickFile(importCSV);else if(action==='importJson')pickFile(importJSON);
 else if(action==='deleteNote'&&confirm('確定刪除這篇日誌嗎？')){state.journal=state.journal.filter(x=>x.id!==el.dataset.id);persist();render();}
 else if(action==='deleteNews'&&confirm('確定刪除這則消息嗎？')){state.news=state.news.filter(x=>x.id!==el.dataset.id);persist();render();}
 else if(action==='clearHistory'&&confirm('清除本機歷史快照？這會使 5／10／20 筆籌碼累積重新開始。')){state.history=[];persist();render();}
});
document.addEventListener('change',e=>{if(e.target.id==='sectorFilter'){state.sector=e.target.value;render();}else if(e.target.id==='stockSort'){state.sort=e.target.value;render();}else if(e.target.id==='valuationStock'){state.activeStock=e.target.value;render();}});
let searchTimer=null;document.addEventListener('input',e=>{if(e.target.id==='stockSearch'){state.filter=e.target.value;clearTimeout(searchTimer);const sel=e.target.selectionStart;searchTimer=setTimeout(()=>{render();const input=$('stockSearch');input?.focus();input?.setSelectionRange(sel,sel);},180);}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='epsForm'){
 const eps27=csvNumber(d.get('eps27')),eps28=csvNumber(d.get('eps28'));state.eps[state.activeStock]={eps27:eps27>0?eps27:null,eps28:eps28>0?eps28:null,date:String(d.get('date')||''),source:String(d.get('source')||''),memo:String(d.get('memo')||'')};persist();closeModal();render();
 }else if(f.id==='noteForm'){state.journal.push({id:Date.now().toString(36),date:String(d.get('date')),title:String(d.get('title')).trim(),text:String(d.get('text')).trim()});persist();closeModal();render();}
 else if(f.id==='newsForm'){const url=String(d.get('url')||'').trim();if(url&&!sourceSafe(url)){alert('來源必須是有效的 http/https 網址');return;}state.news.push({id:Date.now().toString(36),date:String(d.get('date')),title:String(d.get('title')).trim(),text:String(d.get('text')).trim(),level:String(d.get('level')),url});persist();closeModal();render();}
 else if(f.id==='customStockForm'){const code=String(d.get('code')||''),name=String(d.get('name')||'').trim(),sector=String(d.get('sector')||'自訂觀察').trim();if(!/^[0-9]{4}$/.test(code)){alert('請輸入 4 碼股票代號');return;}if(allPool().some(x=>x.code===code)){alert('觀察池已有這個代號');return;}state.custom.push({code,name,sector});state.watch.push(code);persist();render();}
});
$('refreshBtn').addEventListener('click',refresh);
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))closeModal();});
if(state.data?.rows?.length){setNotice(`<strong>已恢復本機快照。</strong> 最後存檔交易日 ${esc(state.data.asOf)}。這是快取，請按「更新資料」取得最近已公布的官方盤後數字。`,'success');}
render();
// Official end-of-day JSON is served from the same GitHub Pages path.
// Scheduled collector runs on weekdays; a browser refresh reads the newest published snapshot.
if(!state.data)setNotice('<strong>準備同步官方盤後資料。</strong> 若首次排程尚未完成，請稍後再次按「更新資料」。');
refresh();
window.addEventListener('focus',()=>{if(Date.now()-(window.marketRadarLastSyncCheck||0)>20*60*1000)refresh({quiet:true});});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-(window.marketRadarLastSyncCheck||0)>20*60*1000)refresh({quiet:true});});

</script>
</body>
</html>
