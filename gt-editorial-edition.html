<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light">
<title>GOOD THINGS, | Clothing First · Editorial Edition 01</title>
<style>
:root{font-family:"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC",sans-serif;background:#fff;color:#242924}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #315f40;outline-offset:2px}
.editorial-toolbar{position:relative;z-index:3;display:flex;flex-wrap:wrap;gap:13px;align-items:center;justify-content:space-between;padding:12px clamp(14px,2.4vw,38px);background:#f8f9f6;border-bottom:1px solid #e1e7e0;min-height:81px}
.identity{display:grid;gap:5px;min-width:195px}
.identity strong{font:600 13px/1.2 Arial,sans-serif;letter-spacing:.016em;color:#315f40}
.identity p{margin:0;font-size:10px;line-height:1.55;letter-spacing:.01em;color:#667366}
.sections{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.sections button{background:transparent;border:0;padding:10px 8px;color:#626f65;font:500 10px/1.3 Arial,sans-serif;letter-spacing:.06em}
.sections button[aria-current=true]{color:#315f40;border-bottom:1px solid #315f40}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{display:flex;gap:2px;padding:3px;background:#e6ebe4;border-radius:3px}
.toggle button{border:0;background:transparent;padding:10px 13px;color:#4e5b50;border-radius:2px;font:500 11px Arial,sans-serif;white-space:nowrap}
.toggle button[aria-pressed=true]{background:#315f40;color:#fff}
.device{border:1px solid #d3dbd1;background:#fff;color:#465448;font:500 11px Arial,sans-serif;padding:11px 13px;border-radius:2px}
.device:hover{background:#eef2ec}
.device[aria-pressed=true]{border-color:#315f40}
.note{font:10px/1.5 Arial,sans-serif;color:#869087;letter-spacing:.01em}
.canvas{height:calc(100dvh - var(--barHeight,81px));overflow:hidden;display:flex;justify-content:center;background:#fff}
.canvas.phone{background:#edeFEB;padding:10px 0 0}
#site{border:0;background:white;width:100%;height:100%;min-height:0;display:block}
.canvas.phone #site{width:min(390px,100vw - 18px);height:100%;box-shadow:0 0 0 1px #dfe4dc}
@media(max-width:950px){
 .identity{flex:1 0 100%;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
 .actions{flex:1;justify-content:flex-end}
 .sections{justify-content:flex-start;gap:1px}
 .sections button{padding:8px 7px;font-size:9px}
 .editorial-toolbar{gap:5px;padding:10px 12px}
}
@media(max-width:550px){
 .identity{gap:3px}
 .identity strong{font-size:12px}
 .identity p{font-size:9px}
 .sections{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-bottom:1px solid #e7eae5}
 .sections button{font-size:9px;padding:10px 2px;letter-spacing:.015em}
 .actions{justify-content:space-between;width:100%;padding-top:7px;gap:4px}
 .toggle{flex:1}
 .toggle button{flex:1;padding:10px 6px;font-size:10px}
 .device{display:none}
 .note{font-size:9px;max-width:110px;text-align:right}
}
</style>
</head>
<body>
<div class="editorial-toolbar" id="toolbar" role="region" aria-label="GOOD THINGS, 編輯視覺提案工具列">
 <div class="identity"><strong>GOOD THINGS, / EDITORIAL EDITION 01</strong><p>Clothing first. Refined, relaxed, a little playful.</p></div>
 <div class="sections" aria-label="查看網站頁面">
   <button type="button" data-route="/" aria-current="true">HOME</button>
   <button type="button" data-route="/journal" aria-current="false">STORIES</button>
   <button type="button" data-route="/features" aria-current="false">FEATURES</button>
   <button type="button" data-route="/index" aria-current="false">INDEX</button>
   <button type="button" data-route="/about" aria-current="false">ABOUT</button>
 </div>
 <div class="actions">
   <div class="toggle" role="group" aria-label="新舊設計比較">
     <button type="button" data-edition="curated" aria-pressed="true">這次的提案</button>
     <button type="button" data-edition="original" aria-pressed="false">預覽站原樣</button>
   </div>
   <button type="button" id="device" class="device" aria-pressed="false">手機寬度</button>
   <span class="note" id="state" role="status" aria-live="polite">沿用預覽站內容 / 正式站未修改</span>
 </div>
</div>
<div class="canvas" id="canvas">
 <iframe id="site" src="./?intro=off#/" title="GOOD THINGS, 既有網站的編輯設計提案" loading="eager"></iframe>
</div>
<script>
(()=>{
 'use strict';
 const $=s=>document.querySelector(s),frame=$('#site'),toolbar=$('#toolbar'),canvas=$('#canvas'),state=$('#state');
 let active='curated',targetRoute='/';
 const buttons=[...document.querySelectorAll('[data-edition]')],routes=[...document.querySelectorAll('[data-route]')];
 const file='./gt-curated-edition-01.css?v=20261026-c2';
 const setHeight=()=>{document.documentElement.style.setProperty('--barHeight',Math.ceil(toolbar.getBoundingClientRect().height)+'px')};
 const ro=new ResizeObserver(setHeight);ro.observe(toolbar);setHeight();
 function apply(){
   let doc;try{doc=frame.contentDocument;if(!doc||!doc.head)return}catch(e){state.textContent='需要先登入預覽站';return}
   const prev=doc.querySelector('#gt-curated-edition-css');if(prev)prev.remove();
   if(active==='curated'){
     const link=doc.createElement('link');link.id='gt-curated-edition-css';link.rel='stylesheet';link.href=file;
     link.onload=()=>{state.textContent='編輯誌提案 / 正式站未修改'};
     link.onerror=()=>{state.textContent='無法載入設計樣式'};
     doc.head.append(link);
   } else state.textContent='預覽站原樣 / 正式站未修改';
 }
 frame.addEventListener('load',apply);
 buttons.forEach(btn=>btn.addEventListener('click',()=>{
   active=btn.dataset.edition;
   buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
   apply();
 }));
 const sync=()=>{let route='/';try{route=(frame.contentWindow.location.hash||'#/').replace(/^#/,'').split('?')[0];}catch(e){}
   targetRoute=route;
   routes.forEach(b=>b.setAttribute('aria-current',String(b.dataset.route===route || (b.dataset.route==='/index'&&route.startsWith('/brands')))));
 };
 frame.addEventListener('load',()=>{try{frame.contentWindow.addEventListener('hashchange',sync);}catch(e){}sync();});
 routes.forEach(btn=>btn.addEventListener('click',()=>{
   targetRoute=btn.dataset.route;routes.forEach(b=>b.setAttribute('aria-current',String(b===btn)));
   try{frame.contentWindow.location.hash='#'+targetRoute;frame.contentWindow.scrollTo({top:0,behavior:'instant'})}
   catch(e){state.textContent='無法切換頁面'}
 }));
 const device=$('#device');device.addEventListener('click',()=>{
   const on=canvas.classList.toggle('phone');
   device.setAttribute('aria-pressed',String(on));
   device.textContent=on?'恢復桌面寬度':'手機寬度';
 });
 window.addEventListener('pageshow',setHeight);
})();
</script>
</body></html>
